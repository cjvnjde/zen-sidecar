    </g>
    <rect x="53" y="30" width="143" height="122" rx="12" fill="#0b1720" opacity=".35"/>
    <rect x="48" y="22" width="143" height="122" rx="12" fill="url(#panel)"/>
    <rect x="61" y="36" width="117" height="18" rx="5" fill="#25515a" opacity=".7"/>
    <g fill="#29525c">
      <rect x="63" y="68" width="9" height="9" rx="3"/>
      <rect x="63" y="91" width="9" height="9" rx="3"/>
      <rect x="63" y="114" width="9" height="9" rx="3"/>
      <rect x="81" y="70" width="78" height="5" rx="2.5" opacity=".7"/>
      <rect x="81" y="93" width="62" height="5" rx="2.5" opacity=".7"/>
      <rect x="81" y="116" width="70" height="5" rx="2.5" opacity=".7"/>
