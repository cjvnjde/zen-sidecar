<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title description">
  <title id="title">Zen Sidecar</title>
  <desc id="description">An original diagram of a narrow tools rail with a second sidebar floating above it. Zen Sidecar: tools within reach, tabs on demand.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a32"/>
      <stop offset="1" stop-color="#101a28"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7e5d3"/>
      <stop offset="1" stop-color="#76b9ca"/>
    </linearGradient>
  </defs>
  <rect width="960" height="250" rx="24" fill="url(#background)"/>
  <path d="M700 0 960 250M780 0 960 174M620 0 870 250" fill="none" stroke="#263b48" stroke-width="1"/>
  <g transform="translate(62 39)">
