  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="302" y="82" fill="#9cd9cb" font-size="13" font-weight="600" letter-spacing="3">A SINE MOD FOR ZEN BROWSER</text>
    <text x="298" y="140" fill="#edf6f5" font-size="53" font-weight="700" letter-spacing="-2">Zen Sidecar</text>
